<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>melon-hub · 吃瓜聚合阅读</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="/style.css">
</head>
<body>

  <header class="topbar">
    <div class="topbar-inner">
      <span class="brand">🍉 melon-hub</span>
      <nav class="site-tabs" id="site-tabs" role="tablist"></nav>
      <div class="topbar-right">
        <div class="view-toggle" role="radiogroup" aria-label="视图">
          <button class="view-btn active" data-view="cards" title="卡片流">▦</button>
          <button class="view-btn" data-view="timeline" title="时间线">☰</button>
          <button class="view-btn" data-view="columns" title="三栏总览">⊞</button>
        </div>
        <button class="refresh-btn" id="sync-btn" title="同步采集(可选站点)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 16h5v5"/></svg>
          <span>同步</span>
        </button>
        <a class="refresh-btn" id="settings-link" href="/settings.html" title="同步与定时设置">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.15 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </a>
      </div>
    </div>
  </header>

  <main class="feed-wrap">
    <div class="feed-meta" id="feed-meta">正在载入…</div>
    <div class="card-flow" id="card-flow">
      <div class="card-skeleton"></div>
      <div class="card-skeleton"></div>
      <div class="card-skeleton"></div>
    </div>
    <div class="load-more-wrap">
      <button class="load-more hidden" id="load-more">加载更多</button>
    </div>
  </main>

  <!-- 全屏阅读抽屉 -->
  <div class="reader-backdrop hidden" id="reader-backdrop">
    <aside class="reader-drawer" role="dialog" aria-modal="true">
      <div class="reader-header">
        <div class="reader-title-group">
          <span class="reader-source" id="reader-source"></span>
          <span class="reader-date" id="reader-date"></span>
          <a class="reader-origin" id="reader-origin" href="#" target="_blank" rel="noopener noreferrer">
            查看原文 ↗
          </a>
        </div>
        <button class="reader-close" id="reader-close" title="关闭 (ESC)" aria-label="关闭阅读">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="reader-body" id="reader-body">
        <h1 class="reader-title" id="reader-title"></h1>
        <div class="article-content" id="article-content"></div>
      </div>
    </aside>
  </div>

  <!-- 同步面板 -->
  <div class="sync-backdrop hidden" id="sync-backdrop">
    <div class="sync-panel" role="dialog" aria-modal="true">
      <div class="sync-header">
        <span class="sync-title">同步采集</span>
        <button class="reader-close" id="sync-close" title="关闭" aria-label="关闭同步面板">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="sync-body">
        <div class="sync-sites" id="sync-sites"></div>
        <div class="sync-actions">
          <button class="sync-start-btn" id="sync-start">开始同步</button>
        </div>
        <div class="sync-note" id="sync-note"></div>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
